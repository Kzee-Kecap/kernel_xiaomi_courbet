name: Build Kernel miui

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository kernel"
        required: true
        default: "https://github.com/Kzee-Kecap/kernel_xiaomi_courbet.git"
      branch:
        description: "Branch yang ingin dibuild"
        required: true
        default: "A15-ksu"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 -y

      - name: Clone Selected Repo
        run: |
          git clone --depth=1 \
            --branch "${{ github.event.inputs.branch }}" \
            "${{ github.event.inputs.repo }}" \
            source

      - name: Build Kernel
        run: |
          cd source
          chmod +x mk.sh
          ./mk.sh
